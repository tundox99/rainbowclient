name: Roblox release

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só testar, sem publicar nada'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roblox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Publicar versão nova do Roblox
        run: node .github/scripts/roblox-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_ADMIN_KEY: ${{ secrets.RC_ADMIN_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
